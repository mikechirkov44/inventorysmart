services:
  db:
    image: postgres:16-alpine
    container_name: inventorysmart-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: inventorysmart
      POSTGRES_USER: inventorysmart
      POSTGRES_PASSWORD: inventorysmart_secret
    volumes:
      - pg-data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inventorysmart"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: inventorysmart-server
    restart: unless-stopped
    volumes:
      - server-uploads:/app/uploads
    expose:
      - "3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DATABASE_URL=postgresql://inventorysmart:inventorysmart_secret@db:5432/inventorysmart
    depends_on:
      db:
        condition: service_healthy

  client:
    build: ./client
    container_name: inventorysmart-client
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - server

volumes:
  pg-data:
  server-uploads:
