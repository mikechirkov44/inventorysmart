services:
  db:
    image: postgres:16-alpine
    container_name: inventorysmart-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-inventorysmart}
      POSTGRES_USER: ${POSTGRES_USER:-inventorysmart}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-inventorysmart_secret}
    volumes:
      - pg-data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-inventorysmart}"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: inventorysmart-server
    restart: unless-stopped
    volumes:
      - server-uploads:/app/uploads
    expose:
      - "3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DATABASE_URL=postgresql://${POSTGRES_USER:-inventorysmart}:${POSTGRES_PASSWORD:-inventorysmart_secret}@db:5432/${POSTGRES_DB:-inventorysmart}
      - JWT_SECRET=${JWT_SECRET:-inventorysmart-secret-key-2026}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      - ADMIN_FULLNAME=${ADMIN_FULLNAME:-Администратор}
    depends_on:
      db:
        condition: service_healthy

  client:
    build:
      context: .
      dockerfile: client/Dockerfile
    container_name: inventorysmart-client
    restart: unless-stopped
    ports:
      - "${APP_PORT:-80}:80"
    depends_on:
      - server

volumes:
  pg-data:
  server-uploads:
