name: Security Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'

jobs:
  npm-audit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        directory: ['.', 'client', 'client-admin']
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        working-directory: ${{ matrix.directory }}
        run: npm ci --no-fund --no-audit

      - name: Run npm audit
        working-directory: ${{ matrix.directory }}
        run: |
          set -o pipefail
          if ! npm audit --audit-level=high; then
            echo "::error::npm audit failed in ${{ matrix.directory }}"
            echo "Full audit report:"
            npm audit || true
            exit 1
          fi
